<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Edit Task</h1>

    <form method="POST">

        <label>Title:</label><br>
        <input
            type="text"
            name="title"
            value="{{ task['title'] }}"
        >
        <br><br>

        <label>Description:</label><br>
        <textarea name="description">{{ task['description'] }}</textarea>
        <br><br>

        <label>Due Date:</label><br>
        <input
            type="date"
            name="due_date"
            value="{{ task['due_date'] }}"
        >
        <br><br>

        <label>Priority:</label><br>
        <select name="priority">

            <option value="Low"
                {% if task['priority'] == 'Low' %}selected{% endif %}>
                Low
            </option>

            <option value="Medium"
                {% if task['priority'] == 'Medium' %}selected{% endif %}>
                Medium
            </option>

            <option value="High"
                {% if task['priority'] == 'High' %}selected{% endif %}>
                High
            </option>

        </select>

        <br><br>

        <label>Status:</label><br>
        <select name="status">

            <option value="To Do"
                {% if task['status'] == 'To Do' %}selected{% endif %}>
                To Do
            </option>

            <option value="In Progress"
                {% if task['status'] == 'In Progress' %}selected{% endif %}>
                In Progress
            </option>

            <option value="Completed"
                {% if task['status'] == 'Completed' %}selected{% endif %}>
                Completed
            </option>

        </select>

        <br><br>

        <button type="submit">Save Changes</button>
        <form action="/tasks" style="display:inline;">
        <button type="submit">cancel</button>

    </form>

    <br>

   

</body>
</html>
